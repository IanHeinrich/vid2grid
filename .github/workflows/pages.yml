name: Test, release & deploy web app to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "fixtures/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage --workspace packages/core
      - run: npm run fixtures
      # Intent-to-add makes a newly generated fixture show up in the diff too.
      - run: |
          git add --intent-to-add fixtures/
          git diff --exit-code fixtures/
      - run: npm run bundle
      - run: git diff --exit-code apps/python-library/src/vid2grid/_core.js

  python-library:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # PyAV 19 dropped 3.11, so only the 3.12 and 3.13 legs resolve it; 3.13 also catches
        # exit hangs that 3.11 shows only rarely.
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/python-library
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  python-apps:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        app: [python-cli, mcp-server]
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The test job's root npm test already runs the Node apps on Linux.
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test --workspace apps/node-library --workspace apps/node-cli
      - run: npm run build --workspace apps/node-library --workspace apps/node-cli
      - run: node apps/node-cli/dist/cli.js fixtures/videos/tiny.mp4 -o sheets --fps 4 --frames-per-grid 4 --resolution 512

  check-version:
    needs: [test, python-library, python-apps, node]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should_release: ${{ steps.check-tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: get-version
        working-directory: apps/web
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check-tag
        run: |
          if git rev-parse "v${{ steps.get-version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # The web build needs no install script; skipping them skips ffmpeg-static's download.
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace apps/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
