name: Test, release & deploy the website and chat app to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "fixtures/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build --workspace apps/web --workspace apps/chat
      - run: npm run lint
      - run: npm run coverage --workspace packages/core
      - run: npm run fixtures
      # Intent-to-add makes a newly generated fixture show up in the diff too.
      - run: |
          git add --intent-to-add fixtures/
          git diff --exit-code fixtures/
      - run: npm run bundle
      - run: git diff --exit-code apps/python-library/src/vid2grid/_core.js

  python-library:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # PyAV 19 dropped 3.11, so only the 3.12 and 3.13 legs resolve it; 3.13 also catches
        # exit hangs that 3.11 shows only rarely.
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/python-library
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  python-apps:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        app: [python-cli, mcp-server]
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The test job's root npm test already runs the Node apps on Linux.
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test --workspace apps/node-library --workspace apps/node-cli
      - run: npm run build --workspace apps/node-library --workspace apps/node-cli
      - run: node apps/node-cli/dist/cli.js fixtures/videos/tiny.mp4 -o sheets --fps 4 --frames-per-grid 4 --resolution 512

  check-version:
    needs: [test, python-library, python-apps, node]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      web_version: ${{ steps.versions.outputs.web_version }}
      web_release: ${{ steps.versions.outputs.web_release }}
      chat_version: ${{ steps.versions.outputs.chat_version }}
      chat_release: ${{ steps.versions.outputs.chat_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: versions
        run: |
          tag_missing() { ! git rev-parse --verify --quiet "refs/tags/$1" >/dev/null; }
          web_version=$(node -p "require('./apps/web/package.json').version")
          chat_version=$(node -p "require('./apps/chat/package.json').version")
          web_release=false
          if tag_missing "v$web_version"; then web_release=true; fi
          chat_release=false
          if [[ $chat_version != 0.0.0 ]] && tag_missing "chat-v$chat_version"; then chat_release=true; fi
          {
            echo "web_version=$web_version"
            echo "web_release=$web_release"
            echo "chat_version=$chat_version"
            echo "chat_release=$chat_release"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: check-version
    if: needs.check-version.outputs.web_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.web_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  release-chat:
    needs: check-version
    if: needs.check-version.outputs.chat_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chat-v${{ needs.check-version.outputs.chat_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: false

  build:
    needs: check-version
    if: needs.check-version.outputs.web_release == 'true' || needs.check-version.outputs.chat_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # A deploy replaces the whole site, so the app not releasing now is rebuilt from its latest tag.
      - env:
          WEB_RELEASE: ${{ needs.check-version.outputs.web_release }}
          CHAT_RELEASE: ${{ needs.check-version.outputs.chat_release }}
        run: |
          latest_tag() { git -c versionsort.suffix=- tag --list "$1" --sort=-v:refname | head -n 1; }
          if [[ $WEB_RELEASE == true ]]; then web_ref=.; else web_ref=$(latest_tag 'v*'); fi
          if [[ $CHAT_RELEASE == true ]]; then chat_ref=.; else chat_ref=$(latest_tag 'chat-v*'); fi
          echo "Website from ${web_ref}, chat app from ${chat_ref:-nowhere}"
          bash scripts/buildPagesSite.sh "$web_ref" "$chat_ref" _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
