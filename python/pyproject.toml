[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vid2grid"
version = "0.1.0"
description = "Turn a video into collage sheets: grid JPEGs packing many timestamped frames"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["av>=14,<20", "mini-racer==0.14.1", "Pillow>=10.1"]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<2"]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
vid2grid = "vid2grid.cli:main"
vid2grid-mcp = "vid2grid.mcp_server:main"

[dependency-groups]
dev = ["faster-whisper>=1.1,<2", "mcp>=1.30,<2", "mypy>=1.10", "pytest>=8.2", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/vid2grid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"
mypy_path = "src"
# PyAV leaves VideoFrame.to_image and from_image unannotated.
untyped_calls_exclude = ["av.video.frame"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "C4", "RUF", "TC", "PLE", "PLW"]
