[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vid2grid"
version = "0.1.0"
description = "Turn a video into collage sheets: grid JPEGs packing many timestamped frames"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["av>=14,<20", "Pillow>=10.1"]

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8.2", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/vid2grid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "C4", "RUF", "TC", "PLE", "PLW"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"
